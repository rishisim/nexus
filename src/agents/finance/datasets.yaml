# Finance dataset shortlist for Nexus experiments.
# Sources were checked live on 2026-06-16.

primary:
  - id: financebench
    name: FinanceBench
    task_type: open_book_financial_qa
    source_url: https://github.com/patronus-ai/financebench
    data_url: https://huggingface.co/datasets/PatronusAI/financebench
    public_examples: 150
    size_note: "Paper benchmark has 10,231 questions; public repository/sample exposes 150 annotated examples."
    evidence_type: "public company filings with answer evidence strings"
    answer_style: "short answer with supporting evidence"
    nexus_fit: "High: tests retrieval, evidence selection, and grounded financial QA."
    first_pass_priority: 1
    implementation_notes:
      - "Use the public 150-example sample for initial runs unless full benchmark access is available."
      - "Preserve provided evidence strings for adjudication and evaluation."
      - "Good first dataset for the headline better-and-cheaper claim."

  - id: finder
    name: FinDER
    task_type: financial_rag_qa
    source_url: https://huggingface.co/datasets/Linq-AI-Research/FinDER
    paper_url: https://arxiv.org/abs/2504.15800
    public_examples: 5703
    size_note: "5,703 expert-annotated query-evidence-answer triplets."
    evidence_type: "10-K filings and expert-annotated evidence"
    answer_style: "answer with retrieved evidence"
    nexus_fit: "High: ambiguous analyst queries match Scout/Architect bridge-query behavior."
    first_pass_priority: 2
    implementation_notes:
      - "Use retrieval evidence as gold support when available."
      - "Track retrieval success separately from final answer correctness."
      - "Expect this to be the strongest RAG-specific finance benchmark."

  - id: finqa
    name: FinQA
    task_type: numerical_financial_qa
    source_url: https://finqasite.github.io/
    code_url: https://github.com/czyssrs/FinQA
    hf_url: https://huggingface.co/datasets/ChanceFocus/flare-finqa
    public_examples: 883
    size_note: "About 2.8k financial reports and 8k expert-annotated QA pairs."
    evidence_type: "financial report text and tables"
    answer_style: "numeric or short answer with gold reasoning program"
    nexus_fit: "High: useful for checking whether fixed planning helps multi-step numerical reasoning."
    first_pass_priority: 3
    implementation_notes:
      - "Use gold programs for error analysis, not as model input."
      - "Normalize numeric answers carefully: units, percentages, signs, and rounding."

  - id: tatqa
    name: TAT-QA
    task_type: table_text_financial_qa
    source_url: https://nextplusplus.github.io/TAT-QA/
    code_url: https://github.com/NExTplusplus/TAT-QA
    hf_url: https://huggingface.co/datasets/next-tat/TAT-QA
    public_examples: 16552
    size_note: "16,552 questions over 2,757 hybrid contexts from real-world financial reports."
    evidence_type: "semi-structured tables plus related paragraphs"
    answer_style: "single span, multiple spans, or free-form numerical answer"
    nexus_fit: "Medium-high: strong table/text grounding test; may need table-aware search and lookup."
    first_pass_priority: 4
    implementation_notes:
      - "Add table rendering or table_lookup support before broad runs."
      - "Report answer-type breakdowns because extraction and calculation questions differ."

  - id: convfinqa
    name: ConvFinQA
    task_type: conversational_numerical_financial_qa
    source_url: https://github.com/czyssrs/ConvFinQA
    hf_url: https://huggingface.co/datasets/ChanceFocus/flare-convfinqa
    paper_url: https://arxiv.org/abs/2210.03849
    public_examples: 14115
    size_note: "3,892 conversations with 14,115 questions."
    evidence_type: "financial reports inherited from FinQA-style contexts"
    answer_style: "turn-level numerical or short answers in a conversation"
    nexus_fit: "Medium-high: tests follow-up context handling plus numerical reasoning."
    first_pass_priority: 5
    implementation_notes:
      - "Start with turn-level format to fit current runner style."
      - "Later add conversation memory as part of the environment state."

reserve:
  - id: fintextqa
    name: FinTextQA
    task_type: long_form_financial_qa
    source_url: https://aclanthology.org/2024.acl-long.328/
    hf_url: https://huggingface.co/datasets/GPS-Lab/FinTextQA
    size_note: "1,262 source-attributed long-form QA pairs."
    evidence_type: "finance textbooks and government agency websites"
    answer_style: "long-form source-attributed answer"
    nexus_fit: "Medium: valuable for long-form finance answers, but needs a different evaluator."
    implementation_notes:
      - "Use after short-answer finance runs are stable."
      - "Requires judge-based or rubric-based evaluation rather than simple EM."

comparison_protocol:
  fixed_controls:
    - "same model"
    - "same temperature"
    - "same sampled indices"
    - "same evidence corpus"
    - "same max context and retry policy"
  required_metrics:
    - "accuracy_or_task_f1"
    - "exact_match_when_applicable"
    - "llm_calls_per_example"
    - "correct_answers_per_llm_call"
    - "token_cost_if_available"
  minimum_first_run:
    examples_per_dataset: 25
    seeds: [42]
    frameworks: ["react", "nexus"]
    claim_threshold: "Nexus must improve quality and reduce mean LLM calls on the paired sample."
